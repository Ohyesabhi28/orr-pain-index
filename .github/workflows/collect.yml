name: collect

on:
  schedule:
    - cron: "7,22,37,52 0-17 * * *"
  workflow_dispatch:

concurrency:
  group: collect
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out main
        uses: actions/checkout@v4

      # The data branch is checked out into data/, so its raw/ and public/
      # directories are data/raw and data/public (the CLI defaults).
      - name: Check out data branch
        uses: actions/checkout@v4
        with:
          ref: data
          path: data

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Collect observations
        env:
          TOMTOM_API_KEY: ${{ secrets.TOMTOM_API_KEY }}
        run: python -m collector.run --routes routes.yaml --raw-dir data/raw

      # A build failure must not lose the collected raw rows: record the
      # outcome, commit raw/ below, then fail the job in the last step.
      - name: Build public JSON
        id: build
        continue-on-error: true
        run: python -m analysis.build --routes routes.yaml --raw-dir data/raw --out-dir data/public

      - name: Commit and push data
        working-directory: data
        env:
          BUILD_OUTCOME: ${{ steps.build.outcome }}
        run: |
          stamp=""
          if [ -f public/latest.json ]; then
            stamp=$(python -c "import json; print(json.load(open('public/latest.json')).get('observed_at_utc') or '')" || true)
          fi
          if [ -z "$stamp" ]; then
            stamp=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add raw
          if [ "$BUILD_OUTCOME" = "success" ]; then
            git add public
          fi
          if git diff --cached --quiet; then
            echo "No data changes to commit."
          else
            git commit -m "data: $stamp"
            git push origin HEAD:data
          fi

      - name: Fail if build failed
        if: steps.build.outcome == 'failure'
        run: |
          echo "analysis.build failed; raw data was committed."
          exit 1
